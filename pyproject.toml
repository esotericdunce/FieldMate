[project]
name = "fieldmate"
version = "0.1.0"
description = "Voice-based field diagnostic assistant for PC troubleshooting"
readme = "README.md"
authors = [
    { name = "BaXter", email = "exanaxe@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.6.0",
    "livekit-agents[rime]>=1.6.9",
    "livekit-api>=1.2.0",
    "livekit-plugins-deepgram>=1.6.9",
    "livekit-plugins-rime>=1.6.9",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "uvicorn>=0.52.1",
    "websockets>=17.0.1",
]

[project.scripts]
fieldmate = "fieldmate:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

